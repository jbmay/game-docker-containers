name: Build Game Server Images

on:
  push:
    branches: [main]
    paths:
      - 'games/**'
      - '.github/workflows/build-game-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'games/**'
      - '.github/workflows/build-game-images.yml'
  workflow_dispatch:
    inputs:
      game:
        description: 'Specific game to build (leave empty for all)'
        required: false
        type: string
      rebuild_all:
        description: 'Rebuild all games'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  # Detect which games have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.detect.outputs.games }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect changed games
        id: detect
        env:
          REQUESTED_GAME: ${{ github.event.inputs.game }}
          REBUILD_ALL: ${{ github.event.inputs.rebuild_all }}
        run: |
          list_all_games() {
            find games -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          list_changed_games() {
            git diff --name-only "$@" \
              | awk -F/ '$1 == "games" && NF > 1 { print $2 }' \
              | sort -u \
              | while read -r game; do
                  if [ -d "games/${game}" ]; then
                    printf '%s\n' "${game}"
                  fi
                done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          if [ "${REBUILD_ALL}" = "true" ]; then
            echo "Rebuilding all games..."
            CHANGED=$(list_all_games)
          elif [ -n "${REQUESTED_GAME}" ]; then
            # Manual trigger with specific game
            if [[ ! "${REQUESTED_GAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || [ ! -d "games/${REQUESTED_GAME}" ]; then
              echo "Unknown game directory: ${REQUESTED_GAME}" >&2
              exit 1
            fi
            CHANGED=$(jq -cn --arg game "${REQUESTED_GAME}" '[$game]')
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # An empty manual game input means build every current game.
            CHANGED=$(list_all_games)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR - detect changed directories
            CHANGED=$(list_changed_games "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            if [ "${CHANGED}" = "[]" ]; then
              # A workflow-only change should exercise every current game.
              CHANGED=$(list_all_games)
            fi
          else
            # Push to main - build all games with changes since last commit
            CHANGED=$(list_changed_games HEAD~1 HEAD 2>/dev/null) || CHANGED='[]'
            if [ "${CHANGED}" = "[]" ]; then
              # Fallback: list all games
              CHANGED=$(list_all_games)
            fi
          fi

          echo "games=${CHANGED}" >> "${GITHUB_OUTPUT}"

      - name: Show detected games
        run: echo "Building games - ${{ steps.detect.outputs.games }}"

  build-game:
    needs: detect-changes
    if: needs.detect-changes.outputs.games != '[]' && needs.detect-changes.outputs.games != 'null'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.detect-changes.outputs.games) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check if game directory exists
        id: check
        run: |
          if [ -d "games/${{ matrix.game }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Container Registry
        if: steps.check.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image version
        if: steps.check.outputs.exists == 'true'
        id: build_info
        shell: bash
        run: |
          VERSION_FILE="games/${{ matrix.game }}/build.env"
          if [ ! -f "${VERSION_FILE}" ]; then
            echo "versioned=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          read_value() {
            local key="$1"
            sed -n "s/^${key}=//p" "${VERSION_FILE}" | head -n 1
          }

          SERVER_VERSION="$(read_value SERVER_VERSION)"
          GAME_VERSION="$(read_value GAME_VERSION)"
          BUILD_TAG="$(read_value BUILD_TAG)"

          : "${SERVER_VERSION:?SERVER_VERSION must be set in ${VERSION_FILE}}"
          : "${GAME_VERSION:?GAME_VERSION must be set in ${VERSION_FILE}}"
          : "${BUILD_TAG:?BUILD_TAG must be set in ${VERSION_FILE}}"

          for value in "${SERVER_VERSION}" "${GAME_VERSION}" "${BUILD_TAG}"; do
            if [[ ! "${value}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Invalid version value '${value}' in ${VERSION_FILE}" >&2
              exit 1
            fi
          done

          IMAGE_TAG="${SERVER_VERSION}-build.${BUILD_TAG}"
          echo "versioned=true" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo 'build_args<<EOF'
            echo "SERVER_VERSION=${SERVER_VERSION}"
            echo "GAME_VERSION=${GAME_VERSION}"
            echo "BUILD_TAG=${BUILD_TAG}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Extract metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.game }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=${{ steps.build_info.outputs.image_tag }},enable=${{ steps.build_info.outputs.versioned }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: games/${{ matrix.game }}
          build-args: ${{ steps.build_info.outputs.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.game }}
          cache-to: type=gha,mode=max,scope=${{ matrix.game }}
          platforms: linux/amd64
